[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscadorapp"
version = "1.0.2"
description = "Buscador Ágil: encuentra cualquier archivo al instante en Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
buscadorapp = "buscadorapp.__main__:main"

[tool.setuptools.packages.find]
include = ["buscadorapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
